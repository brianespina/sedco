h1: An East County Plumber Who Actually Comes to Alpine
intro:
  - >-
    Ask around Alpine and you’ll hear the same complaint: plumbers from the city either won’t make the drive or
    tack a surcharge onto every visit for the privilege. Sedco Plumbing sees it differently. Our shop in El Cajon
    sits at the bottom of the I-8 grade, which puts most Alpine addresses 20 to 25 minutes from a dispatched
    truck — close enough for genuine same-day service, without treating your zip code like a foreign country.

sections:
  - heading: The “Will They Even Come Out Here” Problem, Solved
    paragraphs:
      - >-
        Distance is only a problem for companies that aren’t built for it. We schedule Alpine work in efficient
        windows, stock our trucks so a second trip is the exception, and quote flat-rate pricing that doesn’t
        quietly absorb a travel penalty. Emergencies get the same treatment: a burst line or failed water heater
        in Alpine is dispatched [HOURS], the same as one five minutes from our shop. Being locally owned in East
        County means Alpine isn’t the edge of our map — it’s the middle of it.

  - heading: Rural Systems We Work On Every Week
    paragraphs:
      - >-
        Alpine’s larger properties come with plumbing the suburbs never see. Many homes run on private wells, so
        we service pressure tanks, switches, and supply lines on the house side of the wellhead, and we install
        filtration systems tuned to what your particular water carries. Propane is the standard fuel outside the
        town core, and our licensed technicians run and repair the gas lines feeding ranges, water heaters, fire
        pits, and generators. Closer to the center of town, Padre Dam serves piped water — hard, like most
        imported East County supply — so scale-related heater and fixture problems follow you even up the
        mountain.


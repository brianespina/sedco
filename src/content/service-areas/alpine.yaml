faqs:
  - question: How long does it really take you to reach Alpine?
    answer:
      - >-
        Plan on 20–25 minutes from El Cajon straight up Interstate 8 for most addresses, a bit more for properties
        well off Tavern Road or Japatul Valley Road. We’ll give you an honest arrival window when you book, and we
        keep it.
  - question: Can you install or repair propane lines for my appliances?
    answer:
      - >-
        Yes — gas line work is part of our C-36 license ([LICENSE #]), and propane-fed ranges, water heaters, and
        outdoor appliances are routine jobs for us in Alpine. Every line we run is pressure-tested before it goes
        into service.
  - question: My well water stains fixtures and tastes off. Can you fix that?
    answer:
      - >-
        Usually, yes. We start with the symptoms you’re seeing, match a filtration or softening system to the
        problem, and install it with proper bypasses so maintenance is simple. District water customers in the
        town core benefit from softening too, since Padre Dam’s supply runs hard.


h1: Plumbing Service for Rancho San Diego’s Not-So-New Homes
intro:
  - >-
    The master-planned communities around Jamacha Valley and Cuyamaca College still feel newer than most of
    East County — tidy streets, HOA landscaping, houses from the 1980s through the early 2000s. But do the math
    and the surprise lands: many of these “newer” homes are now 25 to 40 years old, and their plumbing has
    quietly crossed into the age where things start to fail. Sedco Plumbing is just down the road in El Cajon,
    and Rancho San Diego has become one of our busiest service areas for exactly this reason.

sections:
  - heading: '“Newer” Homes Are Quietly Getting Old'
    paragraphs:
      - >-
        The signature problem here is the copper pinhole leak. The thin-wall copper used through the building
        booms of the 80s and 90s corrodes from the inside — aggressive water chemistry and decades of flow wear
        microscopic pits into the pipe until one finally weeps through. The first leak often shows up as a stain on
        a ceiling or a musty smell in a wall, and where there’s one pinhole, siblings usually follow. We repair
        individual leaks, and when a home starts producing them in series, we lay out honest repipe options rather
        than selling you an endless sequence of drywall patches. The same age curve applies to original water
        heaters, pressure regulators, and angle stops — components with 15-to-25-year lifespans, in homes now
        older than that.

  - heading: Plumbing Services We Provide in Rancho San Diego
    paragraphs:
      - >-
        Our most-requested work in the 92019 area includes [leak detection and
        repair](/services/slab-leak-repair/) for pinholes and slab leaks, [water line repair and whole-house
        repiping](/services/water-lines/), [water heater replacement](/services/water-heater/) — including
        tankless upgrades popular in these floor plans — and [pressure regulator
        service](/services/water-pressure-regulators/) for the many homes here running above 80 psi. We also
        handle drain cleaning, toilet repair, garbage disposals, and bathroom remodel plumbing; the full menu
        lives on [our services page](/services/).

  - heading: Why Neighbors Here Call Sedco
    paragraphs:
      - >-
        Rancho San Diego sits in Otay Water District territory, and its imported supply carries the mineral load
        typical of the region — one reason we install so many filtration and softener systems in these
        communities, and one factor in that copper corrosion. Beyond water chemistry, what keeps neighbors calling
        back is simpler: a locally owned company, a C-36 license ([LICENSE #]), flat-rate quotes approved before
        work starts, and technicians who respect HOA parking rules and leave the house cleaner than they found it.

faqs:
  - question: How close is Sedco Plumbing to Rancho San Diego?
    answer:
      - >-
        Very — our El Cajon base is roughly 10–15 minutes away via Jamacha Road or Highway 94, covering the
        neighborhoods around Cuyamaca College and Jamacha Valley alike. Same-day service is realistic most days,
        with emergency dispatch [HOURS].
  - question: What does a copper pinhole leak look like before it becomes a flood?
    answer:
      - >-
        Early clues include a faint water stain on drywall, blistering paint, a musty odor, or a water meter that
        creeps with every fixture off. Pinholes rarely announce themselves loudly, which is why we recommend
        acting on small signs quickly.
  - question: Is it better to fix each pinhole or repipe the whole house?
    answer:
      - >-
        One leak in an otherwise sound system is worth a spot repair. Two or three within a couple of years
        usually means the pipe walls are failing generally, and a repipe becomes the cheaper path over any
        five-year window. We’ll show you the removed pipe sections so the decision is based on evidence.


  - heading: Padre Dam Water and What It Means for Your Fixtures
    paragraphs:
      - >-
        Santee is served by Padre Dam Municipal Water District, and like most imported East County supply, the
        water arrives hard. Expect scale on showerheads, cloudy spots on glassware, and mineral buildup that
        quietly steals efficiency from your water heater year after year. We flush heaters, replace
        scale-clogged cartridges and angle stops, and install softeners and whole-house filtration for families
        who are tired of fighting the buildup room by room.

faqs:
  - question: How long does it take Sedco Plumbing to reach Santee?
    answer:
      - >-
        Usually 10–15 minutes from our El Cajon base — Carlton Hills, Sky Ranch, and the streets near Santee
        Lakes are all close by way of Cuyamaca Street or Highway 67. Emergency calls get priority dispatch
        [HOURS].
  - question: My water heater is original to the house. Should I replace it before it fails?
    answer:
      - >-
        If a tank is past ten or twelve years old, planned replacement is almost always cheaper than an
        emergency one, because you avoid water damage and after-hours urgency. We’ll give you an honest read on
        remaining life and a flat-rate price either way.
  - question: What are the early signs of a slab leak in a Santee tract home?
    answer:
      - >-
        Watch for warm spots underfoot, the sound of running water when everything is off, hairline cracks in
        flooring, or a water bill that climbs without explanation. Early detection keeps the repair small, so
        it’s worth calling at the first suspicion.


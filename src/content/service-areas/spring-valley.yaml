faqs:
  - question: What’s your response time to Spring Valley from El Cajon?
    answer:
      - >-
        Most of Spring Valley — Casa de Oro, La Presa, and Dictionary Hill included — is a 15–20 minute drive
        from our El Cajon base via Highway 94 or Sweetwater Springs Boulevard. We hold same-day slots and
        dispatch emergencies [HOURS].
  - question: How can I tell if my pressure regulator is failing?
    answer:
      - >-
        Test gauges are cheap, but the symptoms are usually loud enough: banging pipes, fixtures that fail early,
        and readings above 80 psi at an outdoor spigot. Regulators typically last 10–15 years, so if yours is
        original, it’s due for a check.
  - question: Do you serve both the Helix and Otay water district areas of Spring Valley?
    answer:
      - >-
        Yes — district boundaries don’t affect where we work, only where your water comes from. We handle
        everything on the homeowner’s side of the meter anywhere in Spring Valley.


h1: Spring Valley Plumbing, From the Valley Floor to Dictionary Hill
intro:
  - >-
    Here’s a number worth knowing if you live on a Spring Valley hillside: 80 psi. That’s the pressure above
    which California plumbing code requires a regulator, and on the slopes of Dictionary Hill and the streets
    climbing out of Casa de Oro and La Presa, street pressure can blow well past it. Sedco Plumbing measures
    pressure on nearly every call in this community, because so many of the “random” failures we’re asked to fix
    — burst supply hoses, dripping relief valves, short-lived faucets — aren’t random at all.

sections:
  - heading: Living on a Hillside Is Hard on Pipes
    paragraphs:
      - >-
        Water districts push high pressure through hillside mains so the homes at the top get decent flow, which
        means the homes lower in the zone absorb the excess. An aging or absent pressure regulator lets that
        force hammer every fixture you own, around the clock. If your pipes bang when a valve closes, your toilet
        fill valves wear out yearly, or your water heater’s relief valve weeps, we can test your static pressure
        in minutes and replace the regulator the same visit. Paired with an expansion tank on the water heater,
        it’s some of the least expensive insurance a hillside home can buy.

  - heading: Older Homes, Two Water Districts
    paragraphs:
      - >-
        Spring Valley’s housing stock skews older, and the neighborhoods tell the story — postwar homes through
        Casa de Oro and La Presa still carrying original galvanized lines, with all the rusty water and shrinking
        flow that implies. The community is also split between Helix Water District and Otay Water District
        depending on where you live, so billing quirks and shutoff locations vary from street to street. We work
        both sides daily. Whatever district sends your bill, the fix at the house is ours: locating leaks,
        replacing corroded lines, and modernizing fixtures on a flat-rate quote you see before we start.


h1: Slab Leak Detection & Repair in Spring Valley, CA
intro:
  - >-
    Most Spring Valley slab leaks are discovered the same way: a Helix or Otay water bill arrives looking like a typo.
    By the time the number jumps, water may have been escaping under your foundation for weeks. Sedco Plumbing
    pinpoints and repairs slab leaks throughout Spring Valley with detection equipment that finds the source without
    exploratory demolition.

sections:
  - heading: The Pressure-and-Copper Problem
    paragraphs:
      - >-
        Two facts about Spring Valley combine badly. First, much of the housing stock is mid-century, built on slabs with
        the original soft copper lines still in service beneath them. Second, hillside lots — Dictionary Hill is the
        classic case — often receive street pressure above 80 psi. High pressure accelerates erosion at every bend in
        aging copper, and pinhole leaks follow. If your regulator has failed or was never installed, your pipes have been
        living a harder life than they were designed for.

  - heading: How We Find a Leak You Cannot See
    paragraphs:
      - >-
        We start at your meter and run a pressure test to confirm a leak exists and isolate it to the hot or cold side.
        Then acoustic listening equipment, line tracing, and thermal imaging narrow the location to a small, marked area
        of the slab. You see the evidence before you approve any repair, and the concrete opening — if one is needed at
        all — stays small.

  - heading: Repairing the Leak and Retiring the Risk
    paragraphs:
      - >-
        Options range from a targeted spot repair to a reroute above the slab to a whole-home repipe when pipe condition
        justifies it. Whichever path fits, we verify your pressure regulator is doing its job before we leave — because
        fixing one pinhole while 90 psi keeps hammering forty-year-old copper is a short-term victory.

faqs:
  - question: What does a slab leak look or sound like?
    answer:
      - >-
        Common signs include warm spots on the floor, the faint sound of running water when everything is off, hairline
        cracks in flooring or baseboards, and moisture at the slab’s edge. A rising water bill with no change in habits is
        the most reliable early flag.
  - question: Will one slab leak lead to more?
    answer:
      - >-
        It can. A pinhole is often the first symptom of pipe reaching the end of its life, especially under sustained high
        pressure. We give you an honest read on overall pipe condition so you can weigh a spot fix against a reroute or
        repipe.
  - question: How quickly can you start leak detection in Spring Valley?
    answer:
      - >-
        Typically same-day. Our technicians come from El Cajon, a short run down SR-94 or Jamacha Road, and suspected slab
        leaks get priority on the schedule. Emergency availability is [HOURS].

